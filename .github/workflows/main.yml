name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files are present."

      - name: CI Build Successful
        run: echo "CI/CD Pipeline completed successfully!"
